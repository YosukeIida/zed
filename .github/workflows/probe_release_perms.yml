name: probe-release-perms
on: workflow_dispatch
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ok: "true"
    steps:
      - run: echo ok

  plain:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create probe-plain --repo "$GITHUB_REPOSITORY" --target math-preview --draft --title probe-plain --notes x

  needs-only:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create probe-needs-only --repo "$GITHUB_REPOSITORY" --target math-preview --draft --title probe-needs-only --notes x

  secret-env-only:
    runs-on: ubuntu-latest
    env:
      TAP_BUMP_APP_ID: ${{ secrets.TAP_BUMP_APP_ID }}
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create probe-secret-env-only --repo "$GITHUB_REPOSITORY" --target math-preview --draft --title probe-secret-env-only --notes x

  both:
    needs: setup
    runs-on: ubuntu-latest
    env:
      TAP_BUMP_APP_ID: ${{ secrets.TAP_BUMP_APP_ID }}
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create probe-both --repo "$GITHUB_REPOSITORY" --target math-preview --draft --title probe-both --notes x
