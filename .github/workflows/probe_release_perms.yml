name: probe-release-perms
on: workflow_dispatch
permissions:
  contents: write
  workflows: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: math-preview
      - run: |
          git tag probe-workflows-perm-test
          git push origin probe-workflows-perm-test
