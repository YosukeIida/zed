name: probe-release-perms
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.TAP_BUMP_APP_ID }}
          private-key: ${{ secrets.TAP_BUMP_APP_PRIVATE_KEY }}
          owner: YosukeIida
          repositories: zed
          permission-contents: write
      - name: target=main, github.token
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create probe-perms-main-ghtoken --repo "$GITHUB_REPOSITORY" --target main --draft --title probe-main-ghtoken --notes x
      - name: target=math-preview, github.token
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create probe-perms-mp-ghtoken --repo "$GITHUB_REPOSITORY" --target math-preview --draft --title probe-mp-ghtoken --notes x
      - name: target=main, app-token
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh release create probe-perms-main-apptoken --repo "$GITHUB_REPOSITORY" --target main --draft --title probe-main-apptoken --notes x
      - name: target=math-preview, app-token
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh release create probe-perms-mp-apptoken --repo "$GITHUB_REPOSITORY" --target math-preview --draft --title probe-mp-apptoken --notes x
