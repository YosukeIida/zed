name: probe-release-perms
on: workflow_dispatch
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ok: "true"
    steps:
      - run: echo ok
  probe-ubuntu:
    needs: setup
    runs-on: ubuntu-latest
    env:
      TAP_BUMP_APP_ID: ${{ secrets.TAP_BUMP_APP_ID }}
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create probe-perms-ubuntu-needs --repo "$GITHUB_REPOSITORY" --target math-preview --draft --title probe-ubuntu-needs --notes x
  probe-macos:
    needs: setup
    runs-on: macos-26
    env:
      TAP_BUMP_APP_ID: ${{ secrets.TAP_BUMP_APP_ID }}
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create probe-perms-macos-needs --repo "$GITHUB_REPOSITORY" --target math-preview --draft --title probe-macos-needs --notes x
